name: Release

# Every push to main whose version (<Version> in PerformanceBooster.csproj) has no release yet is published as one:
# tests, the exe, and the notes of that version from CHANGELOG.md and CHANGELOG.tr.md. Running copies of the app find
# the release (at startup and every 6 hours) and update themselves. Run it by hand to retry a failed release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PerformanceBooster/PerformanceBooster.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { Write-Error 'No <Version> in PerformanceBooster.csproj'; exit 1 }
          gh release view "v$version" *> $null
          $exists = $LASTEXITCODE -eq 0
          Write-Output "Version $version, release exists: $exists"
          "version=$version" >> $env:GITHUB_OUTPUT
          "skip=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.skip == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Tests (localization, app update, version notes)
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          foreach ($section in 'Localization', 'AppUpdate', 'Changelog') {
            dotnet run --project PerformanceBooster.Tests -c Release -- --only $section --no-net
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # The launcher (PerformanceBooster.Launcher) with the app inside, compiled to native code.
      - name: Build the exe
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: dotnet publish PerformanceBooster.Launcher/PerformanceBooster.Launcher.csproj -c Release -o out -p:PublishAot=true

      - name: Release notes
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          # The block of one version: the lines after "## <version>" up to the next "## ".
          function Notes([string] $file, [string] $version) {
            $lines = @(); $inside = $false
            foreach ($line in Get-Content $file -Encoding utf8) {
              if ($line -match '^##\s+v?(\d+(?:\.\d+){1,3})') { if ($inside) { break }; $inside = $Matches[1] -eq $version; continue }
              if ($inside) { $lines += $line }
            }
            ($lines -join "`n").Trim()
          }
          $version = '${{ steps.version.outputs.version }}'
          $en = Notes CHANGELOG.md $version
          $tr = Notes CHANGELOG.tr.md $version
          if (-not $en -or -not $tr) { Write-Error "No notes for $version in CHANGELOG.md and CHANGELOG.tr.md"; exit 1 }
          # The app reads the block of its language after "<!-- lang:xx -->" (Core/Changelog.cs).
          @"
          <!-- lang:en -->
          $en

          <details>
          <summary>Türkçe</summary>

          <!-- lang:tr -->
          $tr

          </details>

          **Download** PerformanceBooster.exe below: Windows 10 (1903 or later) or 11.
          "@ | Set-Content notes.md -Encoding utf8NoBOM

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $prerelease = if ($version.Contains('-')) { '--prerelease' } else { $null }
          gh release create "v$version" out/PerformanceBooster.exe --target $env:GITHUB_SHA --title "Performance Booster $version" --notes-file notes.md $prerelease
